description: >-
  Nine original works of literary fiction, each composed through a
  combination formula that braids two authorial intelligences with two
  structural traditions to produce prose that operates on frequencies
  its characters cannot hear. These are stories where sentences carry
  more than their speakers intend — where the gap between what is said
  and what is understood becomes the territory the reader inhabits alone.
