description: >-
  Nine original works of science fiction, each projected through a
  combination formula that refracts two authorial visions through two
  structural lenses to illuminate futures no single extrapolation could
  have reached. These stories measure their distances in light-years
  but their costs in human error — futures where the technology works
  exactly as designed, and that turns out to be the problem.
