description: >-
  Ten original gothic works, each raised from a combination formula that
  pairs two literary sensibilities with two structural inheritances to
  build houses of prose that settle unevenly into their foundations.
  Victorian manors, postcolonial estates, and southern homesteads share
  the same affliction here — walls that absorb what their inhabitants
  refuse to speak, and corridors that remember what the living have
  trained themselves to forget.
