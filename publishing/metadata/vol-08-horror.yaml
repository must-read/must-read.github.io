description: >-
  Ten original works of horror, each spawned from a combination formula
  that crosses two authorial bloodlines with two structural hosts to
  produce dread no single tradition could have cultivated. These stories
  find their terror not in the extraordinary but in the familiar gone
  slightly wrong — the corner of a room that watches back, the sound
  a house makes when it believes itself unoccupied.
